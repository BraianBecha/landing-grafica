<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <img src="https://picsum.photos/300/200?random=1" alt="Image 1" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=2" alt="Image 2" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=3" alt="Image 3" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=4" alt="Image 4" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=5" alt="Image 5" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=6" alt="Image 6" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=7" alt="Image 7" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=8" alt="Image 8" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=9" alt="Image 9" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=10" alt="Image 10" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=11" alt="Image 11" class="w-full h-auto rounded">
        <img src="https://picsum.photos/300/200?random=12" alt="Image 12" class="w-full h-auto rounded">
    </div>
</body>
</html>
